<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aurora Fitness - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root{--bg:#f5f6fa;--primary:#ff6b35;--primary-dark:#e55a2b;--text:#1a1f36;--text-light:#6b7280;--border:#e5e7eb;--danger:#ef4444;--radius:12px;--radius-sm:8px}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
        .loading{display:none;position:fixed;inset:0;background:rgba(255,255,255,.7);backdrop-filter:blur(4px);z-index:9999;justify-content:center;align-items:center}
        .loading.show{display:flex}
        .spinner{width:36px;height:36px;border:3px solid #e5e7eb;border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .login-wrapper{width:100%;max-width:400px}
        .login-card{background:#fff;border-radius:var(--radius);padding:32px 24px;box-shadow:0 8px 30px rgba(0,0,0,.08);border:1px solid var(--border);text-align:center;border-top:4px solid var(--primary)}
        .login-card .logo{font-size:40px;color:var(--primary);margin-bottom:8px}
        .login-card h1{font-size:22px;font-weight:700;color:var(--text);margin-bottom:4px}
        .login-card h1 span{color:var(--primary)}
        .login-card .subtitle{font-size:11px;color:var(--text-light);margin-bottom:20px}
        .login-tabs{display:flex;gap:0;margin-bottom:20px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border)}
        .login-tab{flex:1;padding:10px;background:#f9fafb;border:none;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;color:var(--text-light);transition:all .15s}
        .login-tab.active{background:var(--primary);color:#fff}
        .form-group{margin-bottom:10px;text-align:left}
        .form-group label{display:block;font-size:10px;font-weight:500;color:var(--text-light);margin-bottom:3px;text-transform:uppercase;letter-spacing:.3px}
        .form-group input{width:100%;padding:10px 14px;background:#f9fafb;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;color:var(--text);font-family:inherit}
        .form-group input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(255,107,53,.06)}
        .btn-login{width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;margin-top:8px}
        .btn-login:hover{background:var(--primary-dark)}
        .login-error{color:var(--danger);font-size:10px;margin-top:8px;display:none}
        .footer{position:fixed;bottom:0;left:0;right:0;padding:10px;text-align:center;font-size:9px;color:var(--text-light);background:#fff;border-top:1px solid var(--border)}
        .footer span{color:var(--primary);font-weight:500}
    </style>
</head>
<body>
<div class="loading" id="loading"><div class="spinner"></div></div>
<div class="login-wrapper">
    <div class="login-card">
        <div class="logo"><i class="fas fa-dumbbell"></i></div>
        <h1>Aurora<span>Fitness</span></h1>
        <p class="subtitle">Sistema de Gestao de Treinos</p>
        <div class="login-tabs">
            <button class="login-tab active" data-tab="instrutor">Instrutor</button>
            <button class="login-tab" data-tab="aluno">Aluno</button>
        </div>
        <div id="formInstrutor">
            <div class="form-group"><label>ID do Instrutor</label><input type="text" id="instrutorId" placeholder="Seu ID"></div>
            <div class="form-group"><label>Senha</label><input type="password" id="instrutorSenha" placeholder="********"></div>
        </div>
        <div id="formAluno" class="hidden">
            <div class="form-group"><label>ID do Aluno</label><input type="text" id="alunoId" placeholder="Seu ID"></div>
            <div class="form-group"><label>Senha</label><input type="password" id="alunoSenha" placeholder="********"></div>
        </div>
        <button class="btn-login" id="btnLogin">Entrar</button>
        <p class="login-error" id="loginError"></p>
    </div>
</div>
<div class="footer">© 2026 Aurora Fitness • Criado por <span>Matheus Pacifico Evangelista</span> | <a href="https://wa.me/5579996458399" style="color:#10b981;text-decoration:none">(79) 99645-8399</a></div>

<script src="supabase.js"></script>
<script>
let tipoLogin = 'instrutor';
document.querySelectorAll('.login-tab').forEach(tab => {
    tab.addEventListener('click', function() {
        document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        tipoLogin = this.dataset.tab;
        document.getElementById('formInstrutor').classList.toggle('hidden', tipoLogin !== 'instrutor');
        document.getElementById('formAluno').classList.toggle('hidden', tipoLogin !== 'aluno');
    });
});

$('btnLogin').addEventListener('click', async () => {
    const err = $('loginError');
    err.style.display = 'none';
    
    let id, senha;
    if (tipoLogin === 'instrutor') {
        id = $('instrutorId').value.trim();
        senha = $('instrutorSenha').value.trim();
    } else {
        id = $('alunoId').value.trim();
        senha = $('alunoSenha').value.trim();
    }
    
    if (!id || !senha) { err.textContent = 'Preencha todos os campos.'; err.style.display = 'block'; return; }
    
    showLoading();
    try {
        if (tipoLogin === 'instrutor') {
            if (id === INSTRUCTOR_ID && senha === INSTRUCTOR_PASSWORD) {
                criarSessao('instrutor', 'instrutor', 'Instrutor');
                window.location.href = 'admin.html';
            } else {
                err.textContent = 'ID ou senha incorretos.';
                err.style.display = 'block';
            }
        } else {
            const { data: client } = await sb.from('clients').select('*').eq('client_id', id).eq('password', senha).single();
            if (client) {
                criarSessao('aluno', client.id, client.name);
                window.location.href = 'aluno.html';
            } else {
                err.textContent = 'ID ou senha incorretos.';
                err.style.display = 'block';
            }
        }
    } catch(e) {
        err.textContent = 'Erro de conexao.';
        err.style.display = 'block';
    }
    hideLoading();
});
</script>
</body>
</html>
